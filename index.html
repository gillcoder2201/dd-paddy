<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DD Seeds Karnal - Payment Pro</title>
    <style>
        :root { --primary: #1b5e20; --accent: #2e7d32; --blue: #1565c0; --bg: #eceff1; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; background: #fff; margin: auto; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; text-align: center; padding: 20px 10px; border-bottom: 5px solid #ffca28; }
        .shop-name { font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }
        .address { font-size: 11px; opacity: 0.9; margin-top: 5px; }
        .card { padding: 15px; margin: 10px; border-radius: 10px; border: 1px solid #cfd8dc; background: #fafafa; }
        .section-title { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { height: 45px; border: 1.5px solid #b0bec5; border-radius: 8px; padding: 0 10px; font-size: 15px; width: 100%; box-sizing: border-box; }
        .btn { border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; display: block; }
        .btn-add { background: var(--blue); color: white; height: 48px; margin-top: 10px; }
        .btn-print { background: var(--primary); color: white; height: 55px; font-size: 18px; margin: 15px 0; }
        .btn-clear { background: #d32f2f; color: white; height: 40px; margin-bottom: 5px; }
        .btn-del-history { background: none; color: #d32f2f; border: 1px solid #d32f2f; height: 35px; font-size: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f1f8e9; padding: 10px; font-size: 11px; text-align: left; border-bottom: 2px solid #c8e6c9; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .summary-box { background: #e8f5e9; padding: 15px; border-radius: 10px; margin: 10px; border: 1px solid #c8e6c9; }
        .grand-total { font-size: 22px; color: var(--primary); font-weight: 900; float: right; }
        .history-card { background: white; border-left: 5px solid var(--blue); padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; margin-top: 4px; display: inline-block; }
        .tag-cash { background: #c8e6c9; color: #2e7d32; }
        .tag-upi { background: #bbdefb; color: #1565c0; }
        .tag-udhaar { background: #ffcdd2; color: #c62828; }
        #printHeader { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .input-area, .btn, .history-section, .action-col, .header, .btn-del-history { display: none !important; }
            #printHeader { display: block !important; text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
            .print-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
            .card { border: none; margin: 0; padding: 0; }
            .summary-box { border: 1px solid #000; background: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p class="shop-name">DD SEEDS KARNAL</p>
        <p class="address">VPO Shahpur Jajan, Gurdaspur, Punjab</p>
    </div>

    <div id="printHeader">
        <h1 style="margin:0; color:#1b5e20;">DD SEEDS KARNAL</h1>
        <p style="margin:5px 0; font-size:12px;">VPO Shahpur Jajan, Tehsil Dera Baba Nanak, Distt Gurdaspur - 143604 (Pb.)</p>
        <div class="print-info"><div id="pInfoLeft"></div><div id="pInfoRight"></div></div>
    </div>

    <div class="card input-area">
        <div class="section-title">📄 Bill & Farmer Info</div>
        <div class="grid-row">
            <input type="number" id="billNo" placeholder="Bill No">
            <input type="date" id="billDate">
        </div>
        <div class="grid-row">
            <input type="text" id="fName" placeholder="Farmer Name">
            <input type="text" id="fVillage" placeholder="Village">
        </div>
        <div class="form-group">
            <label style="font-size: 10px; font-weight: bold; color: #546e7a;">PAYMENT MODE</label>
            <select id="payMode">
                <option value="Cash">CASH (NAGAD)</option>
                <option value="UPI">UPI (ONLINE)</option>
                <option value="Udhaar">UDHAAR (PENDING)</option>
            </select>
        </div>
    </div>

    <div class="card input-area">
        <div class="section-title">🌾 Add Items</div>
        <select id="variety" style="margin-bottom:10px;">
            <option value="" disabled selected>Select Variety</option>
            <optgroup label="PR Varieties"><option>PR - 128</option><option>PR - 131</option><option>110</option><option>HKR - 47</option></optgroup>
            <optgroup label="Basmati Varieties"><option>PUSA 1121</option><option>PUSA 1718</option><option>PUSA 1692</option></optgroup>
        </select>
        <div class="grid-row">
            <select id="packing"><option value="4">4 KG</option><option value="10">10 KG</option></select>
            <input type="number" id="qty" placeholder="Bags">
        </div>
        <input type="number" id="rate" placeholder="Rate Per KG (₹)" style="margin-top:10px;">
        <button class="btn btn-add" onclick="addItem()">+ ADD ITEM</button>
    </div>

    <div class="card">
        <table>
            <thead><tr><th>ITEM</th><th>QTY</th><th>WT</th><th>TOTAL</th><th class="action-col"></th></tr></thead>
            <tbody id="billBody"></tbody>
        </table>
    </div>

    <div class="summary-box">
        <span style="font-size:14px;">Total Weight: <b id="dispWt">0 KG</b></span>
        <span class="grand-total" id="dispAmt">₹ 0.00</span>
        <div style="clear:both;"></div>
    </div>

    <div style="padding: 0 10px;">
        <button class="btn btn-print" onclick="printAndSave()">PRINT & SAVE BILL</button>
        <button class="btn btn-clear" onclick="clearCurrentBill()">NEW BILL (RESET)</button>
    </div>

    <div class="card history-section" style="background:#f1f8e9;">
        <div class="section-title">📂 RECENT BILLS</div>
        <div id="historyList"></div>
        <button class="btn btn-del-history" onclick="deleteFullHistory()">🗑️ CLEAR ALL HISTORY</button>
    </div>
</div>

<script>
    let currentItems = [];
    let billHistory = JSON.parse(localStorage.getItem('dd_pro_v4')) || [];

    window.onload = function() {
        document.getElementById('billDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('billNo').value = localStorage.getItem('dd_lastNo') || "1";
        renderHistory();
    };

    function addItem() {
        const v = document.getElementById('variety').value;
        const p = parseFloat(document.getElementById('packing').value);
        const q = parseFloat(document.getElementById('qty').value) || 0;
        const r = parseFloat(document.getElementById('rate').value) || 0;
        if(!v || q <= 0 || r <= 0) return alert("Fill all fields!");
        currentItems.push({ v, p, q, wt: p*q, amt: (p*q)*r });
        updateTable();
        document.getElementById('qty').value = ""; document.getElementById('rate').value = "";
    }

    function updateTable() {
        const tbody = document.getElementById('billBody'); tbody.innerHTML = "";
        let tWt = 0, tAmt = 0;
        currentItems.forEach((item, i) => {
            tWt += item.wt; tAmt += item.amt;
            tbody.innerHTML += `<tr><td><b>${item.v}</b><br><small>${item.p}kg</small></td><td>${item.q}</td><td>${item.wt}k</td><td>₹${item.amt.toFixed(2)}</td><td class="action-col"><button onclick="removeItem(${i})" style="border:none; background:none; color:red;">✕</button></td></tr>`;
        });
        document.getElementById('dispWt').innerText = tWt + " KG";
        document.getElementById('dispAmt').innerText = "₹ " + tAmt.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    function removeItem(i) { currentItems.splice(i, 1); updateTable(); }

    function printAndSave() {
        if(currentItems.length === 0) return alert("Add items first!");
        const bNo = document.getElementById('billNo').value;
        const bDate = document.getElementById('billDate').value;
        const fName = document.getElementById('fName').value || "Customer";
        const fVill = document.getElementById('fVillage').value || "-";
        const pMode = document.getElementById('payMode').value;

        document.getElementById('pInfoLeft').innerHTML = `Bill No: ${bNo}<br>Date: ${bDate}<br>Payment: ${pMode.toUpperCase()}`;
        document.getElementById('pInfoRight').innerHTML = `Farmer: ${fName}<br>Village: ${fVill}`;

        const bill = { no: bNo, date: bDate, name: fName, village: fVill, mode: pMode, items: [...currentItems], total: document.getElementById('dispAmt').innerText };
        billHistory.unshift(bill);
        localStorage.setItem('dd_pro_v4', JSON.stringify(billHistory.slice(0,50)));
        window.print();
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = billHistory.length === 0 ? "<p style='text-align:center;color:#999;'>No history</p>" : "";
        billHistory.forEach((b, i) => {
            const tagClass = b.mode === 'Cash' ? 'tag-cash' : (b.mode === 'UPI' ? 'tag-upi' : 'tag-udhaar');
            list.innerHTML += `<div class="history-card">
                <div><b>#${b.no}</b> - ${b.name}<br><span class="tag ${tagClass}">${b.mode}</span></div>
                <div style="text-align:right"><b>${b.total}</b><br><button onclick="viewBill(${i})" style="border:none; background:none; color:blue; font-size:10px; cursor:pointer;">Load</button></div>
            </div>`;
        });
    }

    function viewBill(i) {
        const b = billHistory[i];
        document.getElementById('billNo').value = b.no;
        document.getElementById('billDate').value = b.date;
        document.getElementById('fName').value = b.name;
        document.getElementById('fVillage').value = b.village;
        document.getElementById('payMode').value = b.mode || 'Cash';
        currentItems = [...b.items];
        updateTable();
        window.scrollTo(0,0);
    }

    function clearCurrentBill() {
        if(confirm("Naya bill shuru karein?")) {
            localStorage.setItem('dd_lastNo', parseInt(document.getElementById('billNo').value) + 1);
            location.reload();
        }
    }

    function deleteFullHistory() {
        if(confirm("Khatra! Kya aap sach mein pichle saare bills mita dena chahte hain?")) {
            billHistory = [];
            localStorage.removeItem('dd_pro_v4');
            renderHistory();
        }
    }
</script>
</body>
</html>
