<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DD Seeds Karnal - Cloud Billing</title>
    <style>
        :root { --primary: #1b5e20; --accent: #2e7d32; --blue: #1565c0; --bg: #eceff1; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; background: #fff; margin: auto; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; text-align: center; padding: 20px 10px; border-bottom: 5px solid #ffca28; }
        .shop-name { font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }
        .address { font-size: 11px; opacity: 0.9; margin-top: 5px; }
        .card { padding: 15px; margin: 10px; border-radius: 10px; border: 1px solid #cfd8dc; background: #fafafa; }
        .section-title { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { height: 45px; border: 1.5px solid #b0bec5; border-radius: 8px; padding: 0 10px; font-size: 15px; width: 100%; box-sizing: border-box; }
        .btn { border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; display: block; }
        .btn-add { background: var(--blue); color: white; height: 48px; margin-top: 10px; }
        .btn-print { background: var(--primary); color: white; height: 55px; font-size: 18px; margin: 15px 0; }
        .btn-clear { background: #d32f2f; color: white; height: 40px; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f1f8e9; padding: 10px; font-size: 11px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .summary-box { background: #e8f5e9; padding: 15px; border-radius: 10px; margin: 10px; border: 1px solid #c8e6c9; }
        .grand-total { font-size: 22px; color: var(--primary); font-weight: 900; float: right; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; margin-top: 4px; display: inline-block; }
        #printHeader { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .input-area, .btn, .history-section, .action-col, .header { display: none !important; }
            #printHeader { display: block !important; text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
            .print-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
            .card { border: none; margin: 0; padding: 0; }
            .summary-box { border: 1px solid #000; background: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p class="shop-name">DD SEEDS KARNAL</p>
