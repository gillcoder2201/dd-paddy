<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Seeds Karnal - Paddy Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 450px; background: #fff; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid #2e7d32; }
        
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .shop-name { font-size: 24px; font-weight: bold; color: #2e7d32; margin: 0; text-transform: uppercase; }
        .address { font-size: 13px; color: #666; margin: 5px 0; line-height: 1.4; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        select:focus, input:focus { border-color: #2e7d32; outline: none; box-shadow: 0 0 5px rgba(46,125,50,0.2); }
        
        .result-box { background: #f1f8e9; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #c8e6c9; }
        .result-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; }
        .total-label { color: #555; }
        .total-val { font-weight: 800; color: #1b5e20; }
        
        .btn-print { width: 100%; background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-print:hover { background: #1b5e20; }

        @media print {
            .btn-print { display: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <p class="shop-name">DD SEEDS KARNAL</p>
        <p class="address">
            VPO Shahpur Jajan, Tehsil Dera Baba Nanak<br>
            Distt Gurdaspur - 143604 (Punjab)
        </p>
    </div>

    <div class="form-group">
        <label>Seed Variety:</label>
        <select id="variety" onchange="calculate()">
            <optgroup label="PR Varieties">
                <option value="PR-128">PR - 128</option>
                <option value="PR-131">PR - 131</option>
                <option value="110">110</option>
                <option value="HKR-47">HKR - 47</option>
            </optgroup>
            <optgroup label="Basmati Varieties">
                <option value="PUSA 1121">PUSA Basmati 1121</option>
                <option value="PUSA 1718">PUSA Basmati 1718</option>
                <option value="PUSA 1692">PUSA Basmati 1692</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Packing (KG):</label>
            <select id="packing" onchange="calculate()">
                <option value="4">4 KG</option>
                <option value="10">10 KG</option>
            </select>
        </div>
        <div style="flex: 1;">
            <label>Bags (Quantity):</label>
            <input type="number" id="qty" placeholder="0" min="0" oninput="calculate()">
        </div>
    </div>

    <div class="form-group">
        <label>Rate Per KG (₹):</label>
        <input type="number" id="rate" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-line">
            <span class="total-label">Total Weight:</span>
            <span id="totalWeight" class="total-val">0 KG</span>
        </div>
        <div class="result-line" style="border-top: 1px dashed #c8e6c9; padding-top: 10px; margin-top: 5px;">
            <span class="total-label">Grand Total:</span>
            <span id="totalAmount" class="total-val">₹ 0.00</span>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">Print Bill / Save PDF</button>
</div>

<script>
    function calculate() {
        const packing = parseFloat(document.getElementById('packing').value);
        const qty = parseFloat(document.getElementById('qty').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;

        const totalWt = packing * qty;
        const totalAmt = totalWt * rate;

        document.getElementById('totalWeight').innerText = totalWt + " KG";
        document.getElementById('totalAmount').innerText = "₹ " + totalAmt.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }
</script>

</body>
</html>
